[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "seo-agent"
version = "0.1.0"
description = "Autonomous SEO + AEO growth agent (LangGraph + LangChain). Runs fully locally."
readme = "README.md"
requires-python = ">=3.12"  # developed and tested on 3.12 (see .python-version)
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Contracts & config
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    # Orchestration (checkpoints in a local SQLite file)
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    # LLMs (LangChain) — one integration package per provider
    "langchain>=1.4",
    "langchain-core>=1.7",
    "langchain-openai>=1.7",         # OpenAI + Inception Mercury (OpenAI-compatible API)
    "langchain-anthropic>=1.7",
    "langchain-google-genai>=4.4",   # Gemini
    "pyyaml>=6.0",                   # agent prompt files
    # Persistence (SQLite by default — no server needed)
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # Crawling & data sources
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "google-auth[requests]>=2.30",   # Search Console service-account auth
    # Observability
    "structlog>=24.1",
]

[project.scripts]
seo-agent = "seo_agent.runner:main"

[project.optional-dependencies]
# Production database: pip install -e ".[postgres]" and set DATABASE_URL=postgresql+psycopg://...
postgres = [
    "psycopg[binary,pool]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seo_agent"]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["google.*", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
